[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Admin is a private single-page app: never indexed, never rendered by the SEO function.
[[redirects]]
  from = "/admin"
  to = "/app-shell.html"
  status = 200
[[redirects]]
  from = "/admin/*"
  to = "/app-shell.html"
  status = 200

# /sitemap.xml, /rss.xml and /llms.txt are real files written at build time (scripts/prerender.mjs).
# These rules only apply if a file is missing, in which case the function builds them live.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/seo?type=sitemap"
  status = 200
[[redirects]]
  from = "/rss.xml"
  to = "/.netlify/functions/seo?type=rss"
  status = 200
[[redirects]]
  from = "/llms.txt"
  to = "/.netlify/functions/seo?type=llms"
  status = 200
[[redirects]]
  from = "/llm.txt"
  to = "/llms.txt"
  status = 301
  force = true

# Every other path that is not a real file (pages, blog posts, unknown URLs) goes through the SEO function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/seo?type=page&path=/:splat"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
