name: Build and package site
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
      - name: Smoke-check build output
        run: test -s dist/index.html && test -d dist/assets
      - name: Create deployable ZIP
        run: cd dist && zip -r ../smart-lead-systems-site.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: smart-lead-systems-site
          path: smart-lead-systems-site.zip
